<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <title>Loreto's Kitchen — Catering Tracker</title>
  
  <!-- Optimized Viewport for iPhone 5s (iOS 12 Safari) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <!-- Standard & Apple Mobile Web App PWA Configuration -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Loreto's">
  <meta name="format-detection" content="telephone=no">
  <meta name="theme-color" content="#FAF6F0">
  
  <!-- Manifest & Standard Icons -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  
  <!-- Apple Touch Home Screen Icons (iOS 12 / iPhone 5s) -->
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
  
  <!-- Native iOS Startup Splash Image for iPhone 5s (640x1136 Retina @2x, 320x568 pt) -->
  <link rel="apple-touch-startup-image"
        media="(device-width: 320px) and (device-height: 568px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
        href="icons/apple-splash-640x1136.png">
  
  <!-- Primary Application Styles -->
  <link rel="stylesheet" href="css/app.css">

  <style>
    /* Notification Badge Dot for Tabbar */
    .tab {
      position: relative;
    }
    .tab-badge {
      display: none;
      position: absolute;
      top: 4px;
      right: 22%;
      width: 8px;
      height: 8px;
      background: #D63920;
      border-radius: 50%;
      border: 1.5px solid #FAF6F0;
      z-index: 10;
    }

    /* Floating Update Banner (Floats right above bottom tabs) */
    #update-banner {
      display: none;
      position: fixed;
      bottom: 74px;
      left: 12px;
      right: 12px;
      background: #231F1C;
      color: #FAF6F0;
      padding: 12px 14px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      z-index: 99999;
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
    }
    #update-banner .update-content {
      display: -webkit-box;
      display: flex;
      -webkit-box-align: center;
      align-items: center;
      -webkit-box-pack: justify;
      justify-content: space-between;
    }
    #update-banner span {
      font-size: 13px;
      font-weight: 600;
    }
    #update-banner .update-actions {
      display: -webkit-box;
      display: flex;
      -webkit-box-align: center;
      align-items: center;
    }
    #update-banner #update-later-btn {
      background: transparent;
      color: #FAF6F0;
      border: 1px solid rgba(250, 246, 240, 0.35);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
      margin-right: 6px;
    }
    #update-banner #update-btn {
      background: #FAF6F0;
      color: #231F1C;
      border: none;
      padding: 7px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Splash Screen -->
  <div id="splash">
    <div class="splash-brand">
      <div class="splash-logo-ring">
        <img src="icons/icon-192.png" alt="Loreto's Kitchen Logo" class="splash-logo">
      </div>
      <h1 class="splash-title">Loreto's Kitchen</h1>
      <p class="splash-subtitle">Catering Gear & Van Tracker</p>
      <div class="splash-bar">
        <div class="splash-bar-fill"></div>
      </div>
    </div>
  </div>

  <!-- Top Navigation Header -->
  <header id="topbar">
    <div class="topbar-brand">
      <img src="icons/icon-180.png" alt="Loreto's" class="topbar-logo">
      <span id="topbar-title">Loreto's Kitchen</span>
    </div>
    <div class="topbar-right" id="topbar-right"></div>
  </header>

  <!-- Dynamic Scrollable Viewport Area -->
  <main id="view"></main>

  <!-- Update Banner Component with Remind Later -->
  <div id="update-banner">
    <div class="update-content">
      <span>App update available</span>
      <div class="update-actions">
        <button id="update-later-btn" type="button">Later</button>
        <button id="update-btn" type="button">Update</button>
      </div>
    </div>
  </div>

  <!-- Fixed Bottom Tab Bar with Notification Badge -->
  <nav id="tabbar">
    <a href="#/dashboard" class="tab" data-tab="dashboard">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>Home</span>
    </a>
    <a href="#/inventory" class="tab" data-tab="inventory">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/></svg>
      <span>Shelf</span>
    </a>
    <a href="#/catering" class="tab tab-hero" data-tab="catering">
      <div class="tab-hero-bubble">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
      </div>
      <span>Catering</span>
    </a>
    <a href="#/history" class="tab" data-tab="history">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      <span>History</span>
    </a>
    <a href="#/settings" class="tab" data-tab="settings">
      <span class="tab-badge" id="settings-tab-badge"></span>
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="3"/>
        <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
      </svg>
      <span>Settings</span>
    </a>
  </nav>

  <!-- PWA Service Worker Registration & Live Version Sync -->
  <script>
    window.APP_VERSION = 'Loading...';
    window.pendingUpdateWorker = null;

    if ('caches' in window) {
      caches.keys().then(function (keys) {
        for (var i = 0; i < keys.length; i++) {
          if (keys[i].indexOf('lct-') === 0) {
            window.APP_VERSION = keys[i];
            var el = document.getElementById('settings-app-version-tag');
            if (el) el.textContent = keys[i];
            break;
          }
        }
      });
    }

    function showUpdateNotification(worker) {
      window.pendingUpdateWorker = worker;

      var banner = document.getElementById('update-banner');
      var badge = document.getElementById('settings-tab-badge');
      var btnUpdate = document.getElementById('update-btn');
      var btnLater = document.getElementById('update-later-btn');

      if (badge) badge.style.display = 'block';
      if (banner) banner.style.display = 'block';

      if (btnUpdate) {
        btnUpdate.onclick = function () {
          btnUpdate.disabled = true;
          btnUpdate.textContent = 'Updating...';
          worker.postMessage({ action: 'skipWaiting' });
        };
      }

      if (btnLater) {
        btnLater.onclick = function () {
          banner.style.display = 'none';
        };
      }

      if (window.App && window.App.rerenderQuiet) {
        window.App.rerenderQuiet();
      }
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js').then(function (reg) {
          window.swRegistration = reg;

          if (reg.waiting) {
            showUpdateNotification(reg.waiting);
          }

          reg.addEventListener('updatefound', function () {
            var newWorker = reg.installing;
            if (!newWorker) return;

            newWorker.addEventListener('statechange', function () {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                showUpdateNotification(newWorker);
              }
            });
          });

          if (navigator.serviceWorker.controller) {
            navigator.serviceWorker.controller.postMessage({ action: 'getVersion' });
          }

          function checkUpdate() {
            if (navigator.onLine) reg.update().catch(function () {});
          }

          document.addEventListener('visibilitychange', function () {
            if (document.visibilityState === 'visible') checkUpdate();
          });
          window.addEventListener('pageshow', checkUpdate);
          window.addEventListener('online', checkUpdate);
          checkUpdate();

        }).catch(function () {});

        navigator.serviceWorker.addEventListener('message', function (e) {
          if (e.data && e.data.action === 'version') {
            window.APP_VERSION = e.data.version;
            var el = document.getElementById('settings-app-version-tag');
            if (el) el.textContent = e.data.version;
          }
        });

        var refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (!refreshing) {
            refreshing = true;
            window.location.reload();
          }
        });
      });
    }
  </script>

  <!-- Core Scripts in Dependency Order -->
  <script src="js/db.js"></script>
  <script src="js/image.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/store.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/inventory.js"></script>
  <script src="js/views/catering/catering-modals.js"></script>
  <script src="js/views/catering/catering-kits.js"></script>
  <script src="js/views/catering/catering-views.js"></script>
  <script src="js/views/catering/catering.js"></script>
  <script src="js/views/history.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>

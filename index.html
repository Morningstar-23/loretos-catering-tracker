<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Loreto's Catering Tracker</title>
<meta name="description" content="Offline gear tracker for Loreto's Kitchen catering.">
<meta name="theme-color" content="#1E3A2F">
<link rel="manifest" href="manifest.webmanifest">

<!-- iOS web clip -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Loreto's">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">

<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div id="splash" aria-hidden="true">
  <div class="splash-mark">
    <span class="splash-l">L</span>
    <span class="splash-name">Loreto&rsquo;s Kitchen</span>
    <span class="splash-sub">Catering gear, counted home</span>
  </div>
</div>

<header id="topbar">
  <div class="topbar-inner">
    <h1 id="topbar-title">Dashboard</h1>
    <button type="button" class="topbar-act" data-act="topbar" hidden></button>
  </div>
</header>

<main id="view" role="main"></main>

<nav id="tabbar" role="navigation">
  <a class="tab" href="#/dashboard" data-tab="dashboard">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.2 12 4l8 7.2V20a1 1 0 0 1-1 1h-4.5v-5.5h-5V21H5a1 1 0 0 1-1-1z"/></svg>
    <span>Home</span>
  </a>
  <a class="tab" href="#/inventory" data-tab="inventory">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v3H4zM5 11h14v8a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1zm4 3h6v2H9z"/></svg>
    <span>Gear</span>
  </a>
  <a class="tab tab-hero" href="#/catering" data-tab="catering">
    <span class="tab-hero-dot">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 13h12v4H3zM15 11h3.2l2.8 3.4V17h-6zM5.5 20a1.7 1.7 0 1 1 0-3.4 1.7 1.7 0 0 1 0 3.4zm12 0a1.7 1.7 0 1 1 0-3.4 1.7 1.7 0 0 1 0 3.4zM6 10a3 3 0 0 1 6 0z"/></svg>
    </span>
    <span>Event</span>
  </a>
  <a class="tab" href="#/history" data-tab="history">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 1-8.5 12h2.2A6.8 6.8 0 1 0 12 5.2V8L7.5 4.6 12 1.2zM11 8h2v4.6l3.2 1.9-1 1.7L11 13.7z"/></svg>
    <span>History</span>
  </a>
  <a class="tab" href="#/settings" data-tab="settings">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.6A3.4 3.4 0 1 0 12 15.4 3.4 3.4 0 0 0 12 8.6zm8.4 4.9.1-1.5-.1-1.5 1.8-1.4-1.8-3.1-2.2.7a7.6 7.6 0 0 0-2.6-1.5L15.2 2H8.8l-.4 2.2a7.6 7.6 0 0 0-2.6 1.5l-2.2-.7L1.8 8.1 3.6 9.5l-.1 1.5.1 1.5-1.8 1.4 1.8 3.1 2.2-.7a7.6 7.6 0 0 0 2.6 1.5l.4 2.2h6.4l.4-2.2a7.6 7.6 0 0 0 2.6-1.5l2.2.7 1.8-3.1z"/></svg>
    <span>Setup</span>
  </a>
</nav>

<div id="scrim" hidden></div>
<section id="sheet" hidden aria-modal="true" role="dialog">
  <div class="sheet-grab" data-act="sheet-close" aria-hidden="true"></div>
  <header class="sheet-head"><h2 id="sheet-title"></h2>
    <button type="button" class="sheet-x" data-act="sheet-close" aria-label="Close">&times;</button>
  </header>
  <div id="sheet-body"></div>
</section>

<div id="toast" aria-live="polite"></div>

<script src="js/db.js"></script>
<script src="js/image.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/views/dashboard.js"></script>
<script src="js/views/inventory.js"></script>
<script src="js/views/catering.js"></script>
<script src="js/views/history.js"></script>
<script src="js/views/settings.js"></script>
<script src="js/app.js"></script>
</body>
</html>
